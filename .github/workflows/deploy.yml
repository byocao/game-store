name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # daily, so prices and sales stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh Steam data
        if: github.event_name != 'pull_request'
        run: npm run fetch-data || echo "::warning::Steam could not be reached; deploying the committed catalog instead."

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Serve the app for deep links too
        run: cp dist/index.html dist/404.html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
